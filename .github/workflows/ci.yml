name: CI Pipeline


on:
 push:
   branches: [main]
 pull_request:
   branches: [main]


jobs:
 test:
   runs-on: ubuntu-latest
   strategy:
     matrix:
       python-version: ["3.11", "3.12"]


   steps:
     - name: Check out code
       uses: actions/checkout@v4


     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: ${{ matrix.python-version }}


     - name: Install tools
       run: |
        python -m pip install --upgrade pip
        pip install flake8


     - name: Lint
       run: flake8 "Temperature Scripting.py" --count --select=E9,F63,F7,F82 --show-source --statistics


     - name: Check syntax
       run: python -m py_compile "Temperature Scripting.py"


 package:
   needs: test
   runs-on: ubuntu-latest
   if: github.ref == 'refs/heads/main'
   steps:
     - name: Check out code
       uses: actions/checkout@v4


     - name: Save script as artifact
       uses: actions/upload-artifact@v4
       with:
         name: temperature-script
         path: "Temperature Scripting.py"



